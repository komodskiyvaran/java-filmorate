spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# \u0432 jdbc-url \u0443\u043A\u0430\u0436\u0438\u0442\u0435 \u043F\u0443\u0442\u044C \u043A \u0444\u0430\u0439\u043B\u0443 \u0431\u0430\u0437\u044B \u0434\u0430\u043D\u043D\u044B\u0445
spring.datasource.url=jdbc:h2:file:./db/filmorate;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
